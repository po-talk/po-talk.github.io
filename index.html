<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ぽっと通話 — WebRTC voice room</title>
<style>
  :root{ color-scheme:dark }
  *{ box-sizing:border-box }
  body{ margin:0; font-family:system-ui,"Hiragino Sans",sans-serif;
    background:radial-gradient(1000px 700px at 80% -10%,#1c2b48,#0d1424 60%,#090e1a);
    color:#eef2f8; min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:24px }
  .banner{ width:100%; max-width:440px; margin-bottom:14px; padding:12px 14px; border-radius:12px;
    background:#4a3a10; border:1px solid #a9871f; color:#ffe9b0; font-size:13px; line-height:1.6 }
  .banner button{ margin-top:8px; width:100%; padding:9px; border:0; border-radius:8px; background:#ffd24d; color:#3a2c00; font-weight:700; cursor:pointer }
  .card{ width:100%; max-width:440px; background:rgba(255,255,255,.04);
    border:1px solid rgba(255,255,255,.09); border-radius:18px; padding:28px }
  h1{ margin:0 0 4px; font-size:22px }
  p.sub{ margin:0 0 20px; color:#9fb0c7; font-size:14px; line-height:1.6 }
  label{ display:block; font-size:13px; color:#9fb0c7; margin:14px 0 6px }
  input{ width:100%; padding:12px 14px; border-radius:10px; border:1px solid rgba(255,255,255,.12);
    background:#0d1526; color:#eef2f8; font-size:16px }
  button{ width:100%; margin-top:12px; padding:14px; border:0; border-radius:12px; font-size:16px; font-weight:700; cursor:pointer }
  #join{ background:#00e5cc; color:#063 }
  #unlock{ background:#ffd24d; color:#3a2c00; display:none }
  #mute{ background:#2a3550; color:#eef2f8; display:none }
  #leave{ background:#ff5d5d; color:#fff; display:none }
  /* 参加後の操作は横並び（ミュート／退出を半々に） */
  .actions{ display:flex; gap:12px }
  .actions button{ flex:1; width:auto }
  #copy{ background:#1d2740; color:#cfe; margin-top:8px; padding:10px; font-size:14px }
  .status{ margin-top:18px; padding:14px; border-radius:10px; background:#0d1526; font-size:14px; line-height:1.7 }
  .dot{ display:inline-block; width:9px; height:9px; border-radius:50%; background:#48507a; margin-right:7px; vertical-align:middle }
  .dot.on{ background:#00e5cc }
  .peers{ font-size:26px; font-weight:800; color:#00e5cc }
  a.share{ color:#00e5cc; word-break:break-all; font-size:13px }
  /* アバター選択（絵文字）。共通の button{width:100%} を打ち消して小さなチップにする */
  .avatars{ display:grid; grid-template-columns:repeat(8,1fr); gap:6px; margin-top:6px }
  .avatar{ width:auto; margin:0; padding:8px 0; font-size:20px; line-height:1;
    background:#0d1526; border:1px solid rgba(255,255,255,.12); border-radius:10px }
  .avatar[aria-pressed="true"]{ border-color:#00e5cc; background:#0c2b2a }
  .avatar:disabled{ opacity:.5; cursor:default }
  /* プロフィール折りたたみ（初回は開く、以降は閉じる） */
  .profile{ margin-top:4px }
  .profile > summary{ list-style:none; cursor:pointer; display:flex; align-items:center; gap:10px;
    padding:12px 14px; border-radius:12px; background:#0d1526; border:1px solid rgba(255,255,255,.12) }
  .profile > summary::-webkit-details-marker{ display:none }
  .pf-emoji{ font-size:22px; line-height:1 }
  .pf-name{ font-weight:700; font-size:15px }
  .pf-edit{ margin-left:auto; font-size:12px; color:#00e5cc }
  .pf-open-label{ display:none; font-size:13px; color:#9fb0c7 }
  /* 開いている間は summary を「あなたの名前」ラベル行に変身させ、右端に「閉じる」を置く。
     枠（背景・境界線）は外し、他のラベルと同じ余白で入力欄に繋げる（独立行を作らず一体化） */
  .profile[open] .pf-emoji, .profile[open] .pf-name{ display:none }
  .profile[open] .pf-open-label{ display:inline }
  .profile[open] > summary{ background:none; border:0; padding:14px 2px 6px }
  /* 通話中はプロフィール変更不可：summary をグレーアウトして開閉も止める */
  .profile.locked > summary{ opacity:.5; pointer-events:none }
  /* 参加者リスト（絵文字＋名前） */
  .members{ margin-top:12px; display:flex; flex-direction:column; gap:6px }
  .member{ display:flex; align-items:center; gap:10px; padding:8px 10px; border-radius:10px; background:#0d1526;
    transition:background .12s, box-shadow .12s }
  .member.speaking{ background:#0c2b2a; box-shadow:0 0 0 1px #00e5cc inset }
  /* transform は VAD が毎フレーム直接書き換える。中心基準で拡大し、GPUに乗せる */
  .m-emoji{ font-size:22px; line-height:1; transform-origin:center; will-change:transform }
  .m-name{ font-size:14px; color:#eef2f8; word-break:break-all }
  .m-name .you{ color:#9fb0c7; font-size:12px }
  .m-mute{ margin-left:auto; font-size:15px; opacity:.85 }
  .member.muted .m-emoji{ opacity:.45 }
  .member.muted .m-name{ color:#9fb0c7 }
  /* 2カラム：左＝通話カード／右＝ロビー。狭い画面では縦に積む */
  .wrap{ width:100%; display:flex; flex-wrap:wrap; gap:18px; align-items:flex-start; justify-content:center }
  .lobby{ width:100%; max-width:440px; background:rgba(255,255,255,.04);
    border:1px solid rgba(255,255,255,.09); border-radius:18px; padding:22px }
  .lobby h2{ margin:0 0 10px; font-size:17px }
  .lobby-status{ font-size:13px; color:#9fb0c7; margin-bottom:12px }
  .lobby-note{ margin:12px 0 0; font-size:12px; color:#6f7f96; line-height:1.6 }
  .lobby-list{ display:flex; flex-direction:column; gap:10px; max-height:56vh; overflow-y:auto }
  .room{ width:100%; margin:0; padding:12px 14px; text-align:left; font-weight:400; font-size:14px;
    background:#0d1526; border:1px solid rgba(255,255,255,.09); border-radius:12px }
  .room:hover{ border-color:#00e5cc }
  .room.here{ border-color:#00e5cc; background:#0c2b2a }
  .room-top{ display:flex; align-items:center; gap:8px }
  .room-name{ font-weight:700; font-size:15px }
  .room-count{ margin-left:auto; color:#00e5cc; font-weight:700; font-size:13px }
  .room-people{ margin-top:8px; display:flex; flex-wrap:wrap; gap:6px }
  .rp{ display:inline-flex; align-items:center; gap:4px; background:#0a1830; padding:3px 9px; border-radius:999px; font-size:13px; color:#cfe0f0 }
  .rp.mut{ opacity:.5 }
</style>
</head>
<body>
<div id="banner" class="banner" hidden>
  ⚠️ アプリ内ブラウザではマイクが使えないことがあります。<b>Safari / Chrome で開いて</b>ください。
  <button id="copyTop">🔗 このリンクをコピー</button>
</div>

<div class="wrap">
<div class="card">
  <h1>🦞 ぽっと通話〈実験版〉</h1>
  <p class="sub">同じ部屋名を開いた人どうしが、そのまま音声通話（WebRTC・P2P）。サーバ不要。</p>

  <details id="profileBox" class="profile">
    <summary>
      <span class="pf-emoji" id="pfEmoji">🦞</span>
      <span class="pf-name" id="pfName">名前・アバターを設定</span>
      <span class="pf-open-label">あなたの名前</span>
      <span class="pf-edit" id="pfEdit">変更 ▾</span>
    </summary>
    <input id="name" placeholder="ゲスト" autocomplete="off" maxlength="20" aria-label="あなたの名前">

    <label>アバター</label>
    <div id="avatars" class="avatars"></div>
  </details>

  <label for="room">部屋名</label>
  <input id="room" placeholder="◯◯の部屋" autocomplete="off">

  <button id="join">🎙 参加する</button>
  <button id="unlock">🔊 音声を有効化（タップ）</button>
  <div class="actions">
    <button id="mute">🔇 ミュート</button>
    <button id="leave">📴 退出</button>
  </div>

  <div class="status">
    <div><span class="dot" id="dot"></span><span id="state">未参加</span></div>
    <div style="margin-top:8px">接続中の相手：<span class="peers" id="count">0</span> 人</div>
    <div id="members" class="members"></div>
    <div style="margin-top:10px" id="shareWrap" hidden>
      共有リンク：<br><a class="share" id="share" href="#"></a>
      <button id="copy">🔗 招待リンクをコピー</button>
    </div>
  </div>
</div>

<aside class="lobby">
  <h2>🟢 通話中の部屋</h2>
  <div class="lobby-status" id="lobbyStatus">🛰 ロビーに接続中…</div>
  <div class="lobby-list" id="lobbyList"></div>
  <p class="lobby-note">部屋をタップするとそのまま入室します。通話中は確認のうえ移動します。</p>
</aside>
</div>

<script type="module">
const $ = id => document.getElementById(id)

// アプリ内ブラウザ検知（マイク不可なことがある）
if (/(FBAN|FBAV|Instagram|Line\/|Twitter|MicroMessenger|; wv\))/i.test(navigator.userAgent || '')) $('banner').hidden = false

const copyLink = async btn => {
  try { await navigator.clipboard.writeText(location.href); btn.textContent = 'コピーしました ✓' }
  catch { btn.textContent = '長押しでコピー: ' + location.href }
}
$('copyTop').onclick = () => copyLink($('copyTop'))
$('copy').onclick    = () => copyLink($('copy'))

const roomInput = $('room')
roomInput.value = decodeURIComponent(location.hash.slice(1)) || ''

// プロフィール（名前・アバター絵文字）— ブラウザに保存し次回も引き継ぐ。
// いまは自分の設定を保持するだけ。相手への送信・参加者リスト表示は次の段階で足す。
const AVATARS = ['🦞','🐱','🐶','🦊','🐻','🐼','🐸','🐧','🦉','🐙','🦄','🐝','🌸','⭐','🍎','🍣']
const PROFILE_KEY = 'pot-call-profile'
let savedRaw = null
try { savedRaw = localStorage.getItem(PROFILE_KEY) } catch {}
let profile = { name: '', emoji: AVATARS[0] }
try { if (savedRaw) profile = { ...profile, ...JSON.parse(savedRaw) } } catch {}
const saveProfile = () => { try { localStorage.setItem(PROFILE_KEY, JSON.stringify(profile)) } catch {} }

// 折りたたみヘッダに現在の絵文字＋名前を映す（閉じていても誰か分かるように）
const renderProfileSummary = () => {
  $('pfEmoji').textContent = profile.emoji || '🙂'
  $('pfName').textContent = profile.name || '名前・アバターを設定'
}

const nameInput = $('name')
nameInput.value = profile.name

// 部屋名の初期値：名前を入れると「◯◯の部屋」を自動で入れる。ただし
// ・共有リンク（#部屋名）がある時はそれを尊重（勝手に上書きしない）
// ・ユーザーが部屋名を手で変えたら追従をやめる（直近の自動値と一致する間だけ更新）
let lastAutoRoom = ''
const defaultRoom = () => profile.name ? profile.name + 'の部屋' : ''
const applyAutoRoom = () => {
  if (location.hash) return
  if (roomInput.value === '' || roomInput.value === lastAutoRoom) {
    lastAutoRoom = defaultRoom()
    roomInput.value = lastAutoRoom
  }
}
nameInput.oninput = () => { profile.name = nameInput.value.trim(); saveProfile(); applyAutoRoom(); renderProfileSummary() }
applyAutoRoom()  // 読込時：ハッシュが無ければ保存済みの名前から初期値を作る

const avatarsEl = $('avatars')
AVATARS.forEach(e => {
  const b = document.createElement('button')
  b.type = 'button'; b.className = 'avatar'; b.textContent = e
  b.setAttribute('aria-pressed', String(e === profile.emoji))
  b.onclick = () => {
    profile.emoji = e; saveProfile()
    avatarsEl.querySelectorAll('.avatar').forEach(x => x.setAttribute('aria-pressed', String(x === b)))
    renderProfileSummary()
  }
  avatarsEl.appendChild(b)
})

// 初回（保存データなし）は開いた状態、以降は閉じた状態を初期値にする
const profileBox = $('profileBox')
profileBox.open = !savedRaw
const syncToggleLabel = () => { $('pfEdit').textContent = profileBox.open ? '閉じる ▴' : '変更 ▾' }
profileBox.addEventListener('toggle', syncToggleLabel)  // 開閉に追従して文言を切り替え
syncToggleLabel()
renderProfileSummary()
// 参加中はプロフィール変更を止める（roomInput と同様。送信機能を足すまで見た目を実態に合わせる）
const lockProfile = on => {
  nameInput.disabled = on
  avatarsEl.querySelectorAll('.avatar').forEach(b => { b.disabled = on })
  if (on) profileBox.open = false               // 通話中は畳む
  profileBox.classList.toggle('locked', on)     // 「変更」トグルもグレーアウト＋操作不可に
}

let room, myStream, muted = false, wantWake = false, wakeLock = null
let leaving = null   // 進行中の退出処理（room.leave() は非同期）
let lastRoom = null  // ゾンビroom検出用（下の「③ 部屋に参加」参照）
let joinedId = null  // 参加中の部屋名（null＝未参加）
let warn = ''        // 直近のピア単位エラー（誰とも繋がっていない時だけ表示）
let profileAction = null   // 参加中だけ有効。ミュート状態の配信にも使う（#mute ハンドラ参照）
const peers = new Set()
const audios = new Map()   // peerId → audio要素[]（相手の退出時に個別破棄する）
const profiles = new Map() // peerId → {name, emoji, muted}（相手から届いたプロフィール）

// 自分の現在のプロフィール送信データ（名前・絵文字・ミュート状態）
const myProfilePayload = () => ({ name: profile.name, emoji: profile.emoji, muted })

// Trystero 設定（通話部屋とロビー部屋で共用）。
const TRYSTERO_CONFIG = {
  appId: 'kuramo-webrtc-call',
  // 相手発見を速く・確実に：信頼できるnostrリレーを明示＋多重接続（デフォルトの当たり外れ対策）
  relayConfig: {
    urls: ['wss://relay.damus.io', 'wss://nos.lol', 'wss://relay.primal.net', 'wss://relay.nostr.band', 'wss://offchain.pub'],
    redundancy: 5
  },
  // NAT越え保険：直接繋がらない回線でも中継で確立（登録不要の公開 Open Relay）
  turnConfig: [
    { urls: 'turn:openrelay.metered.ca:80',                username: 'openrelayproject', credential: 'openrelayproject' },
    { urls: 'turn:openrelay.metered.ca:443',               username: 'openrelayproject', credential: 'openrelayproject' },
    { urls: 'turn:openrelay.metered.ca:443?transport=tcp', username: 'openrelayproject', credential: 'openrelayproject' }
  ]
}
// ライブラリ読込は一度だけ。ロビー（ページ読込時）と参加（ボタン押下時）で共有する。
// 失敗時はキャッシュを捨てて次回リトライできるようにする（参加フローの段階別エラー表示を壊さない）。
let trysteroPromise = null
const loadTrystero = () => {
  if (!trysteroPromise) trysteroPromise = import('https://esm.sh/trystero@0.25.2?bundle').catch(e => { trysteroPromise = null; throw e })
  return trysteroPromise
}

const setState = (t, on) => { $('state').textContent = t; $('dot').classList.toggle('on', !!on) }
const setCount = () => { $('count').textContent = peers.size }

// 参加者リスト（自分＋接続中の相手）を描く。名前・絵文字は textContent で入れる（受信データは信用しない）。
const membersEl = $('members')
const emojiEls = new Map()  // uid('self'|peerId) → 現在の絵文字要素（描き直すたび貼り替え、VADから参照する）
const memberRow = (emoji, name, you, isMuted) => {
  const row = document.createElement('div'); row.className = 'member' + (isMuted ? ' muted' : '')
  const av = document.createElement('span'); av.className = 'm-emoji'; av.textContent = emoji || '🙂'
  const nm = document.createElement('span'); nm.className = 'm-name'; nm.textContent = name || 'ゲスト'
  if (you) { const t = document.createElement('span'); t.className = 'you'; t.textContent = '（あなた）'; nm.append(' ', t) }
  row.append(av, nm)
  if (isMuted) { const m = document.createElement('span'); m.className = 'm-mute'; m.textContent = '🔇'; m.title = 'ミュート中'; row.append(m) }
  return row
}
const renderMembers = () => {
  membersEl.replaceChildren(); emojiEls.clear()
  if (!joinedId) return
  const add = (uid, emoji, name, you, isMuted) => {
    const row = memberRow(emoji, name, you, isMuted)
    emojiEls.set(uid, row.querySelector('.m-emoji'))
    membersEl.appendChild(row)
  }
  add('self', profile.emoji, profile.name, true, muted)
  // peers（接続の事実）を軸にし、プロフィール未着の相手は仮表示にする
  peers.forEach(id => { const p = profiles.get(id) || {}; add(id, p.emoji, p.name, false, !!p.muted) })
}

// アクティブスピーカー検出（VAD）：各ストリームの音量を測り、話している人の絵文字を跳ねさせる。
// Analyserは解析専用で出力には繋がない（音は既存の<audio>が鳴らす）。iOSはユーザー操作で
// AudioContextを起動する必要があるため、生成は参加ボタン押下（=ジェスチャ）の流れの中で行う。
let audioCtx = null
const analysers = new Map()  // uid → {analyser, data, src}
let vadRAF = null
const ensureAudioCtx = () => {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)()
  if (audioCtx.state === 'suspended') audioCtx.resume().catch(() => {})
  return audioCtx
}
const addAnalyser = (uid, stream) => {
  try {
    removeAnalyser(uid)   // 同じ相手のストリーム再取得（再ネゴ）で二重登録・リークしないように
    const ctx = ensureAudioCtx()
    const src = ctx.createMediaStreamSource(stream)
    const analyser = ctx.createAnalyser()
    analyser.fftSize = 512; analyser.smoothingTimeConstant = 0.6
    src.connect(analyser)
    analysers.set(uid, { analyser, data: new Uint8Array(analyser.fftSize), src })
    if (!vadRAF) vadRAF = requestAnimationFrame(vadTick)
  } catch {}
}
const removeAnalyser = uid => {
  const a = analysers.get(uid)
  if (a) { try { a.src.disconnect() } catch {} ; analysers.delete(uid) }
}
const stopVad = () => {
  if (vadRAF) { cancelAnimationFrame(vadRAF); vadRAF = null }
  analysers.forEach((_, uid) => removeAnalyser(uid))
  if (audioCtx) { audioCtx.close().catch(() => {}); audioCtx = null }
}
const vadTick = () => {
  analysers.forEach(({ analyser, data }, uid) => {
    analyser.getByteTimeDomainData(data)
    let sum = 0
    for (let i = 0; i < data.length; i++) { const v = (data[i] - 128) / 128; sum += v * v }
    const rms = Math.sqrt(sum / data.length)
    const el = emojiEls.get(uid)
    if (!el) return
    const active = rms > 0.045    // ノイズ床より上を「話している」とみなすしきい値
    el.style.transform = active ? 'scale(' + (1 + Math.min((rms - 0.045) * 4, 0.55)).toFixed(3) + ')' : 'scale(1)'
    el.parentElement.classList.toggle('speaking', active)
  })
  vadRAF = analysers.size ? requestAnimationFrame(vadTick) : null
}

// 表示は「実際に繋がっている人数」から導く。
// 繋がってさえいれば、幽霊ピアのハンドシェイク失敗などは表に出さない。
const render = () => {
  if (!joinedId) return
  if (peers.size) setState('🟢 通話中：' + joinedId, true)
  else if (warn) setState('⚠️ ' + warn + '（相手を探しています…）', true)
  else setState('🟢 参加中：' + joinedId + '（相手を探しています…）', true)
}
const play = el => el.play().catch(() => { $('unlock').style.display = 'block' })
const allAudios = () => [...audios.values()].flat()
const dropAudios = id => {
  (audios.get(id) || []).forEach(a => { a.srcObject = null; a.remove() })
  audios.delete(id)
}

$('unlock').onclick = () => { if (audioCtx) audioCtx.resume().catch(() => {}); allAudios().forEach(a => a.play().catch(() => {})); $('unlock').style.display = 'none' }

const wake = async () => { try { wakeLock = await navigator.wakeLock.request('screen') } catch {} }
document.addEventListener('visibilitychange', () => {
  if (wantWake && document.visibilityState === 'visible') wake()
})

$('join').onclick = async () => {
  const roomId = roomInput.value.trim() || 'lobby'
  location.hash = encodeURIComponent(roomId)
  $('share').textContent = location.href; $('share').href = location.href; $('shareWrap').hidden = false

  // ⓪ 退出処理の完了待ち
  // room.leave() は非同期で、最後まで走って初めて部屋の登録が解除される。
  // 解除前に joinRoom すると「退出済みの死んだroom」が例外なしで返ってくるので、必ず待つ。
  if (leaving) {
    setState('⏳ 退出処理の完了を待っています…', false)
    await leaving
  }

  // ① マイク取得
  setState('① マイクを取得中…（許可を押して）', false)
  try {
    myStream = await navigator.mediaDevices.getUserMedia({ audio: true })
  } catch (e) {
    setState('❌ マイク取得失敗: ' + e.name, false); return
  }

  // ② 接続ライブラリ読込
  setState('② 接続ライブラリを読込中…', false)
  let joinRoom
  try {
    ({ joinRoom } = await loadTrystero())
  } catch (e) {
    setState('❌ ライブラリ読込失敗: ' + (e.message || e), false); return
  }

  // ③ 部屋に参加
  try {
    room = joinRoom(TRYSTERO_CONFIG, roomId, {
      // ピア単位の非致命エラー（幽霊ピアへのハンドシェイク失敗など）。部屋自体は生きていて
      // 他の相手とは繋がるので、状態は上書きせず render() の判断に委ねる。
      onJoinError: d => { warn = d.error?.message || String(d.error || '不明'); render() }
    })

    // 前回の退出が最後まで完了していないと、joinRoom は新しい部屋を作らず
    // 同じ（死んだ）roomオブジェクトを返す。掴んだままだと永久に繋がらないので弾く。
    if (room === lastRoom) {
      room = null
      setState('❌ 前回の退出処理が完了していません。ページを再読込してください', false); return
    }
    lastRoom = room

    // プロフィール交換：接続が張れた相手に自分の名前・絵文字・ミュート状態を送る。相手も同じことを
    // するので、双方の onPeerJoin だけで両方向が揃う。名前・絵文字は通話中不変だが、muted は変わるので
    // ミュート切替時に同じペイロードを再送する（下の #mute ハンドラ）。
    // onMessage は最初のピア接続イベントより前（この同期ブロック内）に必ず代入しておく。
    profileAction = room.makeAction('profile')
    profileAction.onMessage = (data, { peerId }) => {
      const prev = profiles.get(peerId) || {}
      profiles.set(peerId, {
        name: String(data?.name ?? prev.name ?? '').slice(0, 20),
        emoji: String(data?.emoji ?? prev.emoji ?? '🙂').slice(0, 8),
        muted: !!data?.muted
      })
      renderMembers()
    }
    const sendProfile = id => profileAction.send(myProfilePayload(), { target: id }).catch(() => {})

    room.addStream(myStream)
    room.onPeerStream = (stream, id) => {
      const a = document.createElement('audio')
      a.srcObject = stream; a.autoplay = true; a.playsInline = true
      document.body.appendChild(a)
      audios.set(id, [...(audios.get(id) || []), a])
      addAnalyser(id, stream)   // 相手の音量を測って絵文字を跳ねさせる
      play(a)
    }
    room.onPeerJoin = id => { peers.add(id); room.addStream(myStream, { target: id }); sendProfile(id); warn = ''; setCount(); render(); renderMembers() }
    room.onPeerLeave = id => { peers.delete(id); profiles.delete(id); dropAudios(id); removeAnalyser(id); setCount(); render(); renderMembers() }
  } catch (e) {
    setState('❌ 接続失敗: ' + (e.message || e), false); return
  }

  wantWake = true; wake()
  joinedId = roomId; warn = ''; render(); renderMembers()
  addAnalyser('self', myStream)   // 自分のマイク音量でも絵文字を跳ねさせる（ミュート中は無反応）
  startHeartbeat()                // ロビーへ自分の在室（部屋名・名前・絵文字）を定期発信
  renderLobby()                   // 自分の部屋を一覧に即反映（here ハイライト）
  $('join').style.display = 'none'; $('mute').style.display = 'block'; $('leave').style.display = 'block'
  roomInput.disabled = true; lockProfile(true)
}

$('mute').onclick = () => {
  muted = !muted; myStream.getAudioTracks().forEach(t => t.enabled = !muted)
  $('mute').textContent = muted ? '🔊 ミュート解除' : '🔇 ミュート'
  if (profileAction) profileAction.send(myProfilePayload()).catch(() => {})  // 全員へミュート状態を配信
  sendHeartbeat()  // ロビーの自分にもミュート状態を反映
  renderMembers(); renderLobby()  // 自分の行／ロビーの 🔇 を即反映
}

$('leave').onclick = () => {
  const leftRoom = room; room = null
  if (myStream) { myStream.getTracks().forEach(t => t.stop()); myStream = null }
  ;[...audios.keys()].forEach(dropAudios)
  wantWake = false; if (wakeLock) { wakeLock.release().catch(() => {}); wakeLock = null }
  peers.clear(); profiles.clear(); setCount(); profileAction = null
  stopVad()        // 解析ループ停止＋AudioContext破棄（join が確保したものを全て解放）
  stopHeartbeat()  // ロビーへ「退出した」を通知＋定期発信を停止（ロビー部屋自体は閲覧用に残す）
  joinedId = null; warn = ''; renderMembers(); renderLobby()
  muted = false; $('mute').textContent = '🔇 ミュート'
  setState('退出しました', false)
  $('join').style.display = 'block'; $('mute').style.display = 'none'; $('leave').style.display = 'none'; $('unlock').style.display = 'none'
  roomInput.disabled = false; lockProfile(false)

  // UIは即座に戻すが、実際の退出は非同期に続く。次の参加はこれの完了を待つ（⓪参照）。
  // 失敗しても再参加を塞がないよう握りつぶす（掴んだ場合は上のゾンビ検出が拾う）。
  if (leftRoom) leaving = leftRoom.leave().catch(() => {}).finally(() => { leaving = null })
}

// ───────── ロビー（通話中の部屋の死活監視・一覧） ─────────
// 仕組み：Nostr には部屋一覧APIが無いので、固定の隠し部屋 __lobby__ に全員が入り、
// 通話中の人だけが自分の在室情報を定期発信する。受信側は部屋ごとに集約し、一定時間
// 無音になった相手＝落ちたとみなして消す（切断イベントでも即消し）。ロビーは閲覧用に
// ページ生存中ずっと残す（通話部屋とは別。leave しない）。
const LOBBY_ROOM = '__lobby__'
const HEARTBEAT_MS = 5000    // 在室ハートビート間隔
const STALE_MS = 15000       // これだけ無音なら「落ちた」とみなす
let lobbyRoom = null, lobbyPresence = null, heartbeatTimer = null
const presences = new Map()  // 発信者peerId → {room, name, emoji, muted, ts}

const heartbeatPayload = () => joinedId
  ? { room: joinedId, name: profile.name, emoji: profile.emoji, muted }
  : { room: null }
const sendHeartbeat = () => { if (lobbyPresence) lobbyPresence.send(heartbeatPayload()).catch(() => {}) }
const startHeartbeat = () => { sendHeartbeat(); if (!heartbeatTimer) heartbeatTimer = setInterval(sendHeartbeat, HEARTBEAT_MS) }
const stopHeartbeat = () => {
  if (heartbeatTimer) { clearInterval(heartbeatTimer); heartbeatTimer = null }
  if (lobbyPresence) lobbyPresence.send({ room: null }).catch(() => {})  // 「退出した」を明示（joinedId のクリア順に依存しない）
}

const renderLobby = () => {
  const list = $('lobbyList'), status = $('lobbyStatus')
  if (!lobbyRoom) return  // 接続前は初期メッセージのまま
  // 部屋名 → 参加者[] に集約。自分は自分の発信を受け取らないので、通話中なら合成して足す。
  const byRoom = new Map()
  const push = (room, p) => { (byRoom.get(room) || byRoom.set(room, []).get(room)).push(p) }
  presences.forEach(v => push(v.room, { name: v.name, emoji: v.emoji, muted: v.muted }))
  if (joinedId) push(joinedId, { name: profile.name, emoji: profile.emoji, muted })
  list.replaceChildren()
  const names = [...byRoom.keys()].sort()
  status.textContent = names.length ? '' : 'いま通話中の部屋はありません'
  names.forEach(room => {
    const people = byRoom.get(room)
    const btn = document.createElement('button'); btn.className = 'room' + (room === joinedId ? ' here' : '')
    const top = document.createElement('div'); top.className = 'room-top'
    const nm = document.createElement('span'); nm.className = 'room-name'; nm.textContent = '🏠 ' + room
    const ct = document.createElement('span'); ct.className = 'room-count'; ct.textContent = people.length + '人'
    top.append(nm, ct)
    const ppl = document.createElement('div'); ppl.className = 'room-people'
    people.forEach(p => {
      const rp = document.createElement('span'); rp.className = 'rp' + (p.muted ? ' mut' : '')
      const e = document.createElement('span'); e.textContent = p.emoji || '🙂'
      const n = document.createElement('span'); n.textContent = (p.name || 'ゲスト') + (p.muted ? ' 🔇' : '')
      rp.append(e, n); ppl.append(rp)
    })
    btn.append(top, ppl)
    btn.onclick = () => selectRoom(room)
    list.append(btn)
  })
}

// 一覧クリック：タップした部屋にそのまま入室する（＝参加ボタンと同じ意味）。
// フォーカスは当てない（スマホでキーボードが出るのを避ける）。通話中に別部屋をタップしたら
// 確認のうえ今の部屋を退出してから入り直す（自室のタップは無視）。
const selectRoom = room => {
  if (room === joinedId) return
  if (joinedId) {
    if (!confirm('参加中の部屋「' + joinedId + '」を退出して「' + room + '」に移りますか？')) return
    $('leave').onclick()   // 今の部屋を退出（非同期の後片付けは leaving が保持し、次の参加で待たれる）
  } else {
    if (!confirm('「' + room + '」に参加しますか？')) return   // 未参加時のミスタップ防止
  }
  roomInput.value = room
  $('join').onclick()      // そのまま入室。参加の⓪で leaving を待つので、部屋移動でも取りこぼさない
}

const initLobby = async () => {
  const status = $('lobbyStatus')
  let joinRoom
  try {
    ({ joinRoom } = await loadTrystero())
  } catch {
    status.textContent = '⚠️ ロビーを読み込めませんでした（通話は使えます）'; return
  }
  try {
    lobbyRoom = joinRoom(TRYSTERO_CONFIG, LOBBY_ROOM)
    lobbyPresence = lobbyRoom.makeAction('presence')
    lobbyPresence.onMessage = (d, { peerId }) => {
      if (!d || d.room == null) presences.delete(peerId)
      else presences.set(peerId, {
        room: String(d.room).slice(0, 40), name: String(d.name || '').slice(0, 20),
        emoji: String(d.emoji || '🙂').slice(0, 8), muted: !!d.muted, ts: Date.now()
      })
      renderLobby()
    }
    // 新しい閲覧者が来たら、自分が通話中なら即座に在室を送って一覧を埋める
    lobbyRoom.onPeerJoin = () => { if (joinedId) sendHeartbeat() }
    lobbyRoom.onPeerLeave = peerId => { presences.delete(peerId); renderLobby() }
    // 取りこぼし対策：一定時間更新の無い相手を掃除
    setInterval(() => {
      const cut = Date.now() - STALE_MS; let changed = false
      presences.forEach((v, k) => { if (v.ts < cut) { presences.delete(k); changed = true } })
      if (changed) renderLobby()
    }, HEARTBEAT_MS)
    renderLobby()
  } catch {
    status.textContent = '⚠️ ロビーに接続できませんでした'
  }
}
initLobby()
</script>
</body>
</html>
